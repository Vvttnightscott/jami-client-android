name: CI checks

# Two tiers of per-PR feedback:
#   * fast static checks (scripts, gradle wrapper) that need no native build;
#   * an android-build job that compiles a debug APK inside the project's own
#     Docker image so Kotlin/resource regressions are caught automatically.
# The full instrumented test suite still runs in the Jenkins/Gerrit pipeline
# defined in ci/Jenkinsfile.

on:
  pull_request:
  push:
    branches:
      - master

# Avoid stacking the expensive android-build job: a newer push to the same ref
# cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Shell & Python script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax (bash -n)
        run: |
          set -e
          for f in compile.sh update-translations.sh fdroidMergeRequest.sh ci/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: ShellCheck (fail on errors)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Gate only on genuine errors; the vendored cqfd script is excluded
          # as it is third-party and maintained upstream.
          shellcheck --severity=error \
            compile.sh \
            update-translations.sh \
            fdroidMergeRequest.sh \
            ci/jami_test.sh \
            ci/start_emu_headless.sh \
            ci/download_screenshots.sh

      - name: Python syntax check
        run: python3 -m py_compile update_version.py

      - name: Verify version bumper against real build file
        run: |
          set -e
          cp jami-android/app/build.gradle.kts /tmp/build.gradle.kts
          python3 update_version.py -p /tmp/build.gradle.kts
          echo "--- resulting version lines ---"
          grep -E 'versionCode|versionName' /tmp/build.gradle.kts

  gradle-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verifies the checked-in gradle-wrapper.jar matches a known-good Gradle
      # release, complementing the distributionSha256Sum pin in
      # gradle-wrapper.properties.
      - uses: gradle/actions/wrapper-validation@v4

  android-build:
    name: Compile debug APK (x86_64)
    runs-on: ubuntu-latest
    # The daemon + contrib native build is long; allow generous headroom.
    timeout-minutes: 300
    steps:
      - name: Check out with submodules (daemon)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The contrib build and NDK are large; reclaim space the hosted runner
      # spends on toolchains we do not use (everything runs inside Docker).
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      # Build only the toolchain stage of the project's own image so the SDK,
      # NDK and SWIG versions exactly match the maintained build environment.
      - name: Build project toolchain image
        run: docker build -f docker/Dockerfile --target build -t jami-build .

      # Compile a single ABI to keep the native build to one architecture.
      # assembleDebug exercises Kotlin + resource compilation, which is what
      # catches regressions in the wizard/onboarding UI changes.
      - name: Compile debug APK
        run: |
          docker run --rm \
            -e ANDROID_ABI=x86_64 \
            -v "$PWD":/src -w /src \
            jami-build bash -c './compile.sh'

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-x86_64
          path: jami-android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: ignore
